name: smoke
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/check_public_boundary.py
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: bash run.sh smoke
      - run: bash run.sh prototype-smoke
      - run: python -m run_vioexplain.verify_results
