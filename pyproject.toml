[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vioexplain-benchmark"
version = "0.1.0"
description = "Constraint-violation explanation and reproducible time-series evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "VioExplain contributors"}]
dependencies = ["numpy>=1.24,<3", "pandas>=1.5,<4", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
exact = ["pulp>=2.7,<4"]
build = ["build>=1.2,<2"]
baro = ["requests>=2.28,<3", "tqdm>=4.60,<5", "matplotlib>=3.7,<4"]
shap = ["shap==0.46.0"]
gpu = ["torch>=2,<3", "einops>=0.7,<1"]
chronos = ["chronos-forecasting==2.3.1", "transformers==5.13.1"]

[project.scripts]
vioexplain = "vioexplain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vioexplain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
